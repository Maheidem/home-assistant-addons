configuration:
  startup_command:
    name: Startup command
    description: >-
      Command to run inside the tmux session at container boot, before any
      browser is attached. Stays running until it exits, regardless of
      whether the web terminal is open. Leave empty (default) for a plain
      bash shell — type `claude` yourself. When the command exits, the tmux
      session falls through to a bash prompt so you can reconnect and
      recover.
